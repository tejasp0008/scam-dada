repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
  - repo: local
    hooks:
      # Secrets belong in .env, which is gitignored. This is a backstop, not the policy.
      - id: no-env-file
        name: refuse to commit .env
        entry: .env must never be committed
        language: fail
        files: ^\.env$
